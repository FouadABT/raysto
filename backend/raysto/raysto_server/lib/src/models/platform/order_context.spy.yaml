class: OrderContext
table: raysto_order_context
serverOnly: true
fields:
  restaurantId: int, relation(parent=raysto_restaurant)
  orderId: int, relation(parent=raysto_order)
  visitId: int?
  quoteId: int?
  detailsJson: String
  paymentTiming: String
  cancellationRequested: bool
  stockReleased: bool
  slotKey: String?
  couponCode: String?
  origin: String, default='online'
  customerLabel: String?
  placedBy: String?
  serviceDay: String?
  orderNumber: int?
  pickupCode: String?
  createdAt: DateTime
indexes:
  context_order:
    fields: orderId
    unique: true
  context_daily_number:
    fields: restaurantId, serviceDay, orderNumber
    unique: true
