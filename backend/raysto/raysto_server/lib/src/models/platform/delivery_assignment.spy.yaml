class: DeliveryAssignment
table: raysto_delivery_assignment
serverOnly: true
fields:
  restaurantId: int, relation(parent=raysto_restaurant)
  orderId: int, relation(parent=raysto_order)
  courierId: String?
  status: String
  issueJson: String
  locationJson: String?
  locationExpiresAt: DateTime?
  locationConsent: bool
  version: int
  updatedAt: DateTime
  driverId: int?
  partnerAppId: int?
  partnerRef: String?
  fulfilledBy: String?
  etaAt: DateTime?
  distanceMeters: int?
  feeMinor: int?
  proofKind: String?
  proofMediaId: int?
  codeHash: String?
  pickedUpAt: DateTime?
  deliveredAt: DateTime?
indexes:
  delivery_order:
    fields: orderId
    unique: true
  delivery_courier:
    fields: courierId, status
