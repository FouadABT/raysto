class: PaymentCapture
table: raysto_payment_capture
serverOnly: true
fields:
  restaurantId: int, relation(parent=raysto_restaurant)
  checkoutId: int, relation(parent=raysto_checkout_intent)
  providerCaptureId: String
  amountMinor: int
  refundedMinor: int
  currency: String
  state: String
  createdAt: DateTime
indexes:
  capture_provider:
    fields: providerCaptureId
    unique: true
  capture_checkout:
    fields: checkoutId
    unique: true
