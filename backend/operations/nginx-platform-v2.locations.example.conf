# PREPARED ONLY: include inside api.rays.to's existing TLS server block.
# Reuses the Raysto-only raysto_api zone; do not replace shared nginx.conf.
# Validate syntax and integration only when validation is explicitly resumed.
location = /ready {
    proxy_pass http://127.0.0.1:18082;
}
location = /api/v2/events {
    limit_req zone=raysto_api burst=10 nodelay;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 40s;
    proxy_pass http://127.0.0.1:18082;
}
location ~ ^/api/v2/media/[0-9]+/content$ {
    client_max_body_size 8m;
    client_body_timeout 15s;
    limit_req zone=raysto_api burst=5 nodelay;
    proxy_pass http://127.0.0.1:18082;
}
location /api/v2/webhooks/ {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:18082;
}
location /api/v2/ {
    client_max_body_size 128k;
    limit_req zone=raysto_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:18082;
}
# Existing TLS, proxy headers and Cache-Control no-store are inherited from
# the Raysto TLS server. Add an explicit future-web CORS allowlist when that
# client is implemented; do not enable wildcard credentialed CORS here.
