name: raysto-backend
services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: raysto-backend-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${RAYSTO_DB_PORT:-61810}:5432"
    volumes:
      - raysto_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  raysto_pg18:
    name: raysto-backend-pg18
