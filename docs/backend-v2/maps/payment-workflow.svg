<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280"><rect width="100%" height="100%" fill="#0d1725"/>
<text x="58" y="80" fill="#eef5fc" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">RAYSTO — payment workflow</text>
<text x="60" y="118" fill="#acbfd2" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Approval redirects are a handoff. Only verified provider evidence changes collected money.</text>
<rect x="60" y="155" width="290" height="80" rx="16" fill="#162638" stroke="#ffb46b" stroke-width="2"/>
<text x="82" y="195" fill="#ffb46b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Customer / waiter</text>
<rect x="510" y="155" width="290" height="80" rx="16" fill="#162638" stroke="#ffb46b" stroke-width="2"/>
<text x="532" y="195" fill="#ffb46b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Raysto API</text>
