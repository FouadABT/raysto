<text x="982" y="195" fill="#ffb46b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">PostgreSQL</text>
<rect x="1410" y="155" width="290" height="80" rx="16" fill="#162638" stroke="#ffb46b" stroke-width="2"/>
<text x="1432" y="195" fill="#ffb46b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">PayPal</text>
